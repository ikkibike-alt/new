<canvas id="c"></canvas>
<script>
const C=document.getElementById('c');
function rnd(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;}}
function lin(c,x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));return g;}
function blurDo(c,b,f){c.save();c.filter=`blur(${b}px)`;f();c.restore();}

function room(c,W,H,fy,dir=1){
  const F=H*fy;
  c.fillStyle=lin(c,0,0,W,0,dir>0?['#f4f3f0','#e7e5e0']:['#e7e5e0','#f4f3f0']);c.fillRect(0,0,W,F);
  // soft vertical falloff
  c.fillStyle=lin(c,0,0,0,F,['rgba(0,0,0,0.03)','rgba(0,0,0,0)','rgba(0,0,0,0.02)']);c.fillRect(0,0,W,F);
  c.fillStyle=lin(c,0,F,0,H,['#d9d6cf','#e8e6e1']);c.fillRect(0,F,W,H-F);
  blurDo(c,3,()=>{c.fillStyle='rgba(0,0,0,0.07)';c.fillRect(0,F-2,W,5);});
  return F;
}
// window light: 2x2 panes, sheared
function windowLight(c,x,y,w,h,sk,alpha,b){
  blurDo(c,b,()=>{c.save();c.translate(x,y);c.transform(1,0,sk,1,0,0);
    c.fillStyle=`rgba(255,254,250,${alpha})`;const g=w*0.035;
    for(let i=0;i<2;i++)for(let j=0;j<2;j++)c.fillRect(i*(w/2+g/2),j*(h/2+g/2),w/2-g/2,h/2-g/2);
    c.restore();});
}
function floorLight(c,x,y,w,d,sk,alpha,b){
  blurDo(c,b,()=>{c.save();c.translate(x,y);c.transform(1,0,sk,1,0,0);
    c.fillStyle=`rgba(255,254,250,${alpha})`;const g=w*0.035;
    for(let i=0;i<2;i++)c.fillRect(i*(w/2+g/2),0,w/2-g/2,d);c.restore();});
}
function shadowEllipse(c,x,y,rx,ry,a,b){blurDo(c,b,()=>{c.fillStyle=`rgba(30,28,25,${a})`;c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);c.fill();});}
function grain(c,W,H,amt=7){const d=c.getImageData(0,0,W,H),p=d.data,r=rnd(7);for(let i=0;i<p.length;i+=4){const n=(r()-.5)*amt;p[i]+=n;p[i+1]+=n;p[i+2]+=n;}c.putImageData(d,0,0);}
function vignette(c,W,H){const g=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.07)');c.fillStyle=g;c.fillRect(0,0,W,H);}

function stool(c,cx,F,s){
  const sw=s*1.0,th=s*.07,hgt=s*.9,top=F-hgt+s*.05;
  // cast shadow on floor, skewed right
  blurDo(c,s*.06,()=>{c.save();c.translate(cx,F+s*.05);c.transform(1,0,1.1,.28,0,0);c.fillStyle='rgba(30,28,25,0.13)';
    c.fillRect(-sw/2,-hgt,sw,th*1.5);[-.42,.42,-.3,.3].forEach(k=>c.fillRect(sw*k-s*.012,-hgt,s*.024,hgt));c.restore();});
  shadowEllipse(c,cx,F+s*.04,sw*.55,s*.05,.18,s*.03);
  // legs
  c.strokeStyle='#8f877b';c.lineCap='round';
  [[-.40,-.46,s*.024,'#9a9286'],[.40,.46,s*.024,'#8a8276'],[-.26,-.3,s*.02,'#b0a99d'],[.26,.3,s*.02,'#a8a194']].forEach(([a,b,lw,col])=>{
    c.strokeStyle=col;c.lineWidth=lw;c.beginPath();c.moveTo(cx+sw*a,top+th);c.lineTo(cx+sw*b,F+(Math.abs(a)<.3?-s*.03:s*.03));c.stroke();});
  // stretcher
  c.strokeStyle='#a39b8f';c.lineWidth=s*.012;c.beginPath();c.moveTo(cx-sw*.43,F-hgt*.35);c.lineTo(cx+sw*.43,F-hgt*.35);c.stroke();
  // seat
  c.fillStyle=lin(c,cx-sw/2,0,cx+sw/2,0,['#ddd6cb','#c9c1b4']);
  c.beginPath();c.roundRect(cx-sw/2,top,sw,th,th*.4);c.fill();
  c.fillStyle='rgba(255,255,255,0.35)';c.fillRect(cx-sw/2+th*.3,top,sw-th*.6,th*.18);
  return top;
}
function vase(c,cx,base,s,seed=3){
  const w=s*.32,h=s*.5;
  shadowEllipse(c,cx+s*.06,base,w*.7,s*.025,.22,s*.02);
  c.beginPath();c.moveTo(cx-w*.18,base-h);c.bezierCurveTo(cx-w*.2,base-h*.75,cx-w*.62,base-h*.62,cx-w*.55,base-h*.25);
  c.bezierCurveTo(cx-w*.5,base-h*.05,cx-w*.35,base,cx,base);c.bezierCurveTo(cx+w*.35,base,cx+w*.5,base-h*.05,cx+w*.55,base-h*.25);
  c.bezierCurveTo(cx+w*.62,base-h*.62,cx+w*.2,base-h*.75,cx+w*.18,base-h);c.closePath();
  c.fillStyle=lin(c,cx-w*.6,0,cx+w*.6,0,['#fbfaf8','#efede9','#cfcbc4']);c.fill();
  c.fillStyle='#bdb8b0';c.beginPath();c.ellipse(cx,base-h,w*.18,w*.05,0,0,7);c.fill();
  // branch
  const r=rnd(seed);c.strokeStyle='#3b3a37';c.lineCap='round';
  const stems=[[-.9,1.5],[.5,1.25],[1.2,1.0]];
  stems.forEach(([dx,len],k)=>{
    const x0=cx+(k-1)*w*.06,y0=base-h,x1=x0+dx*s*.28,y1=y0-len*s*.55;
    c.lineWidth=s*.008;c.beginPath();c.moveTo(x0,y0);c.quadraticCurveTo(x0+dx*s*.05,y0-len*s*.3,x1,y1);c.stroke();
    for(let t=.35;t<1;t+=.13){const px=x0+(x1-x0)*t+dx*s*.03*(1-t),py=y0+(y1-y0)*t,side=(Math.round(t*10)%2?1:-1);
      c.save();c.translate(px,py);c.rotate(side*.9+dx*.2+(r()-.5)*.4);c.fillStyle=r()>.5?'#4a4945':'#5c5a55';
      c.beginPath();c.ellipse(s*.03,0,s*.032,s*.011,0,0,7);c.fill();c.restore();}
  });
}

const ART={
hero(W,H){const c=C.getContext('2d');const F=room(c,W,H,.74);
  windowLight(c,W*.08,H*.12,W*.34,H*.5,.45,.75,W*.008);floorLight(c,W*.25,F+H*.01,W*.3,H*.2,1.1,.5,W*.012);
  const top=stool(c,W*.64,F+H*.08,H*.44);vase(c,W*.64,top+2,H*.34,5);vignette(c,W,H);grain(c,W,H);},
cup(W,H){const c=C.getContext('2d');const F=room(c,W,H,.88,-1);
  windowLight(c,W*.35,H*.08,W*.6,H*.62,-.3,.7,W*.01);
  const sy=H*.58,sx0=W*.12,sx1=W*.88;
  blurDo(c,W*.012,()=>{c.fillStyle='rgba(30,28,25,0.14)';c.fillRect(sx0+W*.02,sy+H*.012,sx1-sx0,H*.03);});
  c.fillStyle=lin(c,0,sy-H*.012,0,sy+H*.012,['#f7f6f3','#d6d2cb']);c.fillRect(sx0,sy-H*.012,sx1-sx0,H*.024);
  // cup
  const cx=W*.42,cw=W*.2,ch=W*.16,base=sy-H*.012;
  blurDo(c,W*.01,()=>{c.save();c.translate(cx,base);c.transform(1,0,-.9,.25,0,0);c.fillStyle='rgba(30,28,25,0.16)';c.fillRect(-cw/2,-ch*1.1,cw,ch*1.1);c.restore();});
  c.strokeStyle='#d8d4cd';c.lineWidth=W*.018;c.beginPath();c.ellipse(cx+cw*.55,base-ch*.55,cw*.17,ch*.22,0,-1.4,1.4);c.stroke();
  c.beginPath();c.moveTo(cx-cw/2,base-ch);c.lineTo(cx-cw*.42,base-ch*.08);c.quadraticCurveTo(cx-cw*.4,base,cx-cw*.3,base);c.lineTo(cx+cw*.3,base);c.quadraticCurveTo(cx+cw*.4,base,cx+cw*.42,base-ch*.08);c.lineTo(cx+cw/2,base-ch);c.closePath();
  c.fillStyle=lin(c,cx-cw/2,0,cx+cw/2,0,['#fdfcfa','#f0eeea','#cfcac2']);c.fill();
  c.fillStyle='#c9c4bc';c.beginPath();c.ellipse(cx,base-ch,cw/2,ch*.08,0,0,7);c.fill();
  c.fillStyle='#e9e6e1';c.beginPath();c.ellipse(cx,base-ch+ch*.012,cw/2-W*.006,ch*.065,0,0,7);c.fill();
  vignette(c,W,H);grain(c,W,H);},
shirts(W,H){const c=C.getContext('2d');const F=room(c,W,H,.9);
  windowLight(c,-W*.1,H*.05,W*.55,H*.7,.25,.6,W*.012);
  const ry=H*.2;c.strokeStyle='#2f2e2b';c.lineWidth=W*.008;c.beginPath();c.moveTo(W*.08,ry);c.lineTo(W*.92,ry);c.stroke();
  [[.30,'#fbfaf7','#e3e0da'],[.5,'#d9d6d0','#bdb9b2'],[.7,'#4a4945','#2f2e2b']].forEach(([px,a,b],i)=>{
    const x=W*px,sw=W*.24,top=ry+H*.06,len=H*.4;
    c.strokeStyle='#6d6a64';c.lineWidth=W*.004;c.beginPath();c.arc(x,ry+H*.012,W*.012,Math.PI,0.2);c.moveTo(x,ry+H*.025);c.lineTo(x,top-H*.01);c.stroke();
    blurDo(c,W*.02,()=>{c.fillStyle='rgba(30,28,25,0.12)';c.fillRect(x-sw*.4+W*.03,top+H*.02,sw*.85,len);});
    c.beginPath();c.moveTo(x-sw*.08,top);c.lineTo(x-sw*.45,top+H*.03);c.lineTo(x-sw*.5,top+len*.42);c.lineTo(x-sw*.4,top+len*.44);c.lineTo(x-sw*.38,top+len);
    c.lineTo(x+sw*.38,top+len);c.lineTo(x+sw*.4,top+len*.44);c.lineTo(x+sw*.5,top+len*.42);c.lineTo(x+sw*.45,top+H*.03);c.lineTo(x+sw*.08,top);c.quadraticCurveTo(x,top+H*.03,x-sw*.08,top);c.closePath();
    c.fillStyle=lin(c,x-sw/2,0,x+sw/2,0,[a,b]);c.fill();
    c.strokeStyle='rgba(0,0,0,0.08)';c.lineWidth=W*.002;c.beginPath();c.moveTo(x,top+H*.02);c.lineTo(x,top+len);c.stroke();
  });
  vignette(c,W,H);grain(c,W,H);},
books(W,H){const c=C.getContext('2d');const F=room(c,W,H,.66,-1);
  windowLight(c,W*.52,H*.06,W*.36,H*.46,-.4,.7,W*.008);floorLight(c,W*.42,F+H*.02,W*.3,H*.24,-1.2,.45,W*.012);
  const bx=W*.36,by=F+H*.16;
  [[.30,.07,'#f2f0ec'],[.27,.06,'#3a3936'],[.28,.075,'#cfcac2']].reduce((y,[w,h,col],i)=>{
    const bw=W*w,bh=H*h,x=bx-bw/2+(i-1)*W*.012;
    if(i===0)blurDo(c,W*.012,()=>{c.fillStyle='rgba(30,28,25,0.2)';c.fillRect(x-W*.01,y-H*.01,bw+W*.06,H*.03);});
    c.fillStyle=col;c.fillRect(x,y-bh,bw,bh);c.fillStyle='rgba(255,255,255,0.18)';c.fillRect(x,y-bh,bw,bh*.15);
    if(i!==1){c.fillStyle='rgba(0,0,0,0.06)';for(let k=1;k<5;k++)c.fillRect(x+bw*.02,y-bh+bh*k/5,bw*.96,1);}
    return y-bh;},by);
  // bottle with stem
  const vx=W*.62,vb=F+H*.14,vw=W*.05,vh=H*.2;shadowEllipse(c,vx+W*.02,vb,vw*.9,H*.012,.2,W*.008);
  c.fillStyle=lin(c,vx-vw/2,0,vx+vw/2,0,['rgba(240,239,235,.95)','rgba(200,198,192,.95)']);
  c.beginPath();c.roundRect(vx-vw/2,vb-vh*.7,vw,vh*.7,vw*.2);c.fill();c.fillRect(vx-vw*.16,vb-vh,vw*.32,vh*.32);
  c.strokeStyle='#3b3a37';c.lineWidth=W*.0025;c.beginPath();c.moveTo(vx,vb-vh);c.quadraticCurveTo(vx+W*.02,vb-vh*1.8,vx+W*.05,vb-vh*2.3);c.stroke();
  c.fillStyle='#45443f';for(let k=0;k<5;k++){c.save();c.translate(vx+W*.008+k*W*.009,vb-vh*1.25-k*vh*.22);c.rotate(k%2?.7:-.8);c.beginPath();c.ellipse(W*.01,0,W*.012,W*.004,0,0,7);c.fill();c.restore();}
  vignette(c,W,H);grain(c,W,H);},
wall(W,H){const c=C.getContext('2d');const F=room(c,W,H,.84);
  windowLight(c,W*.3,H*.1,W*.3,H*.6,.55,.8,W*.006);floorLight(c,W*.45,F+H*.01,W*.26,H*.15,1.6,.5,W*.01);
  vignette(c,W,H);grain(c,W,H);}
};
window.render=(name,W,H)=>{C.width=W;C.height=H;ART[name](W,H);return C.toDataURL('image/jpeg',0.86);};
</script>
