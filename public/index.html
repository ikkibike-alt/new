<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>くるまよこぐし｜中古車横断検索</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="logo" href="/">くるま<span>よこぐし</span></a>
      <p class="tagline">複数の中古車サイトをまとめて検索・価格比較</p>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <form id="search" class="searchbar">
        <input name="q" type="search" placeholder="車名・グレードで検索（例: プリウス、N-BOX）" />
        <button type="submit">検索</button>
      </form>
      <p class="stats" id="stats"></p>
    </div>
  </section>

  <main class="wrap layout">
    <aside class="filters">
      <form id="filters">
        <label>メーカー<select name="maker"><option value="">すべて</option></select></label>
        <label>車種<select name="model"><option value="">すべて</option></select></label>
        <label>地域<select name="pref"><option value="">全国</option></select></label>
        <div class="row">
          <label>価格(万円)<input name="priceMin" type="number" min="0" placeholder="下限" /></label>
          <span>〜</span>
          <label>&nbsp;<input name="priceMax" type="number" min="0" placeholder="上限" /></label>
        </div>
        <label>年式<select name="yearMin">
          <option value="">指定なし</option>
        </select></label>
        <label>走行距離<select name="mileageMax">
          <option value="">指定なし</option>
          <option value="10000">1万km以下</option>
          <option value="30000">3万km以下</option>
          <option value="50000">5万km以下</option>
          <option value="100000">10万km以下</option>
        </select></label>
        <label>掲載サイト<select name="source"><option value="">すべて</option></select></label>
        <button type="reset" class="ghost">条件をクリア</button>
      </form>
    </aside>

    <section class="results">
      <div class="toolbar">
        <span id="count"></span>
        <select id="sort">
          <option value="price_asc">価格が安い順</option>
          <option value="price_desc">価格が高い順</option>
          <option value="year_desc">年式が新しい順</option>
          <option value="mileage_asc">走行距離が少ない順</option>
          <option value="new">新着順</option>
        </select>
      </div>
      <div id="list" class="grid"></div>
      <nav id="pager" class="pager"></nav>
    </section>
  </main>

  <footer class="foot wrap">
    掲載情報は各サイトから自動収集したものです。最新の価格・在庫は必ず掲載元でご確認ください。
  </footer>
  <script src="app.js"></script>
</body>
</html>
